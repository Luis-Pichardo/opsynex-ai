name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dotnet:
    name: .NET (build + test)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: backend/**/*.csproj
      # El servicio de IA real se levanta en las pruebas de punta a punta de la homologación.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/pyproject.toml
      - run: pip install -e ../ai-service
      - run: dotnet restore Opsynex.sln
      # Release: los warnings se tratan como errores (Directory.Build.props).
      - run: dotnet build Opsynex.sln -c Release --no-restore
      - run: dotnet test Opsynex.sln -c Release --no-build --logger "trx;LogFilePrefix=results" --collect:"XPlat Code Coverage" --results-directory TestResults/cov
        env:
          OPSYNEX_AI_PYTHON: python
          OPSYNEX_REQUIRE_AI: "true"
      # Cobertura combinada (unitarias + integración): mínimo 80 % en Domain y Application.
      - run: python3 ../scripts/coverage_report.py TestResults/cov --min Opsynex.Domain=80 --min Opsynex.Application=80
      # Sin paquetes con vulnerabilidades conocidas (directos ni transitivos).
      - name: Auditoría de paquetes NuGet
        run: |
          dotnet list Opsynex.sln package --vulnerable --include-transitive | tee vulnerable.txt
          ! grep -q "has the following vulnerable packages" vulnerable.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dotnet-test-results
          path: |
            backend/tests/**/TestResults/*.trx
            backend/TestResults/cov/**/coverage.cobertura.xml
          if-no-files-found: ignore

  python:
    name: Servicio de IA (ruff + pytest)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov=app --cov-report=term --cov-fail-under=80
      - run: pip-audit --skip-editable

  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-24.04
    needs: [dotnet, python, frontend]
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: E2e_Strong!Passw0rd
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'E2e_Strong!Passw0rd' -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 5s --health-retries 20
    env:
      AI_SERVICE_API_KEY: e2e-internal-key
      E2E_ADMIN_EMAIL: admin@e2e.opsynex.local
      E2E_ADMIN_PASSWORD: E2eAdmin2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: backend/**/*.csproj
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Servicio de IA
        working-directory: ai-service
        run: |
          pip install -e .
          nohup uvicorn app.main:app --port 8001 > ../ai-service.log 2>&1 &
      - name: API (.NET)
        working-directory: backend
        env:
          ASPNETCORE_ENVIRONMENT: Production
          ASPNETCORE_URLS: http://localhost:5080
          ConnectionStrings__Default: Server=localhost,1433;Database=opsynex_e2e;User Id=sa;Password=E2e_Strong!Passw0rd;TrustServerCertificate=True
          Database__MigrateOnStartup: "true"
          Jwt__Secret: secreto-de-la-ci-e2e-0123456789-abcdefghijklmn
          Cors__Origins: http://localhost:4173
          AiService__ApiKey: e2e-internal-key
          Seed__AdminEmail: admin@e2e.opsynex.local
          Seed__AdminPassword: E2eAdmin2026
          RateLimiting__LoginPermitLimit: "500"
        run: |
          dotnet build src/Opsynex.Api -c Release
          nohup dotnet run --project src/Opsynex.Api -c Release --no-build --no-launch-profile > ../api.log 2>&1 &
      - name: Frontend (build + preview)
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:5080
        run: |
          npm ci
          npm run build
          nohup npx vite preview --port 4173 --strictPort > ../frontend.log 2>&1 &
      - name: Esperar a que la plataforma responda
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:5080/health > /dev/null && curl -sf http://localhost:4173 > /dev/null && exit 0
            sleep 3
          done
          cat api.log; exit 1
      - name: Pruebas E2E
        working-directory: e2e
        env:
          CI: "true"
          E2E_BASE_URL: http://localhost:4173
          E2E_API_URL: http://localhost:5080
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test --trace off
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
            api.log
            ai-service.log
          if-no-files-found: ignore
