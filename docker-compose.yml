# Opsynex AI — entorno local completo.
#   docker compose up -d sqlserver      → solo la base de datos
#   docker compose up -d --build        → todo (BD, API, IA y frontend)
# Variables: copia .env.example a .env y ajústalas.

name: opsynex

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Opsynex_Dev_2026!}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      # "$$" escapa "$" en compose: la variable se expande dentro del contenedor.
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  ai-service:
    build: ./ai-service
    environment:
      AI_SERVICE_API_KEY: ${AiService__ApiKey:-dev-internal-key}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5-5}
      ANTHROPIC_EFFORT: ${ANTHROPIC_EFFORT:-medium}
      ANTHROPIC_FALLBACKS: ${ANTHROPIC_FALLBACKS:-default}
    ports:
      - "8001:8001"

  api:
    build: ./backend
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      Database__MigrateOnStartup: ${Database__MigrateOnStartup:-true}
      ConnectionStrings__Default: Server=sqlserver,1433;Database=Opsynex;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Opsynex_Dev_2026!};TrustServerCertificate=True
      Jwt__Secret: ${Jwt__Secret:-cambia-este-secreto-de-desarrollo-de-al-menos-32-caracteres}
      Jwt__ExpireMinutes: ${Jwt__ExpireMinutes:-60}
      Seed__AdminEmail: ${Seed__AdminEmail:-}
      Seed__AdminPassword: ${Seed__AdminPassword:-}
      Cors__Origins: ${Cors__Origins:-http://localhost:5173,http://localhost:8081}
      AiService__Enabled: "true"
      AiService__BaseUrl: http://ai-service:8001
      AiService__ApiKey: ${AiService__ApiKey:-dev-internal-key}
      Ai__Enabled: ${Ai__Enabled:-true}
      Ai__MaxRecommendations: ${Ai__MaxRecommendations:-10}
      Upload__MaxMb: ${Upload__MaxMb:-20}
    ports:
      - "8080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      ai-service:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL_DOCKER:-http://localhost:8080}
    environment:
      # Origen del API permitido por la CSP del frontend (connect-src).
      API_ORIGIN: ${VITE_API_URL_DOCKER:-http://localhost:8080}
    ports:
      - "8081:80"
    depends_on:
      - api

volumes:
  sqlserver-data:
